.shell{max-width:1400px;margin:16px auto;background:var(--shell);border-radius:32px;padding:18px 22px 28px;min-height:calc(100vh - 32px)}
/* header */
header{display:flex;align-items:center;gap:14px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:99px;padding:6px 18px 6px 6px;font-weight:800;font-size:15px;letter-spacing:-.2px}
.logo img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.logo small{display:block;font-weight:500;font-size:10.5px;color:var(--mut);letter-spacing:0}
nav.top{display:flex;gap:2px;background:var(--card);border-radius:99px;padding:5px}
nav.top button{all:unset;cursor:pointer;padding:10px 14px;border-radius:99px;color:var(--ink2);font-weight:500;font-size:14px;white-space:nowrap}
nav.top button:hover{background:var(--soft)}
nav.top button.on{background:var(--ink);color:var(--onInk)}
.hr{display:flex;align-items:center;gap:8px}
.icb{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;position:relative}
.icb:hover{background:var(--soft)}
.icb .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.me{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:99px;padding:5px 16px 5px 5px}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--onInk)}
.me b{display:block;font-size:13px}.me small{font-size:11px;color:var(--mut)}
/* hello */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:26px 4px 20px}
.hello h1{font-size:34px;font-weight:700;letter-spacing:-1px}
.hello p{color:var(--mut);margin-top:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border-radius:99px;padding:4px}
.seg button{all:unset;cursor:pointer;padding:8px 14px;border-radius:99px;font-size:13px;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--ink);color:var(--onInk)}
.pill{background:var(--card);border:0;border-radius:99px;padding:10px 16px;width:auto;font-weight:500;font-size:13px;cursor:pointer}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:20px}
.ct{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ct h3{font-size:17px;font-weight:700;letter-spacing:-.3px}
.ct p{font-size:12.5px;color:var(--mut);margin-top:2px}
.mut{color:var(--mut);font-size:12.5px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:99px;font-weight:600;font-size:14px;white-space:nowrap;box-sizing:border-box}
.btn.dark{background:var(--ink);color:var(--onInk)}.btn.dark:hover{filter:brightness(1.15)}
.btn.light{background:var(--soft);color:var(--ink)}.btn.light:hover{background:var(--line)}
.btn.line{border:1px solid var(--line);background:var(--card)}
.btn.acc{background:var(--acc);color:var(--accTx)}.btn.acc:hover{filter:brightness(.95)}
.btn.sm{padding:8px 14px;font-size:12.5px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip.up{background:var(--okS);color:var(--ok)}.chip.dn{background:var(--badS);color:var(--bad)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok)}.st.wa{color:var(--warn)}.st.gr{color:var(--mut)}.st.bad{color:var(--bad)}.st.bl{color:#3B82F6}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--okS);color:var(--ok)}.badge.wa{background:var(--warnS);color:#A86F00}.badge.gr{background:var(--soft);color:var(--ink2)}
.badge svg{width:13px;height:13px}.badge.bad{background:var(--badS);color:var(--bad)}.badge.bl{background:rgba(59,130,246,.12);color:#3B82F6}
.btn.wa{background:#25D366;color:#fff}.btn.wa:hover{filter:brightness(.95)}.btn.wa svg{fill:#fff;stroke:none}
.ob2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.ob2 .btn{flex:1;padding:7px 8px;font-size:12px}
.vpar{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 14px;font-size:11px}
.oc.canc{opacity:.75}.oc .mot{font-size:12px;color:var(--bad);background:var(--badS);border-radius:10px;padding:8px 10px;margin-top:10px}
.logl{font-size:12.5px;padding:8px 0 8px 12px;border-left:2px solid var(--line);margin-left:4px}.logl b{display:block;font-size:13px}
.k6{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))!important}
.cxrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}.cxrow:last-child{border:0}
.cxrow.tt{font-weight:700;font-size:15px}.cxrow input{width:140px;text-align:right}
.diff{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:600;font-size:14px;display:flex;justify-content:space-between}
.diff.ok{background:var(--okS);color:var(--ok)}.diff.bad{background:var(--badS);color:var(--bad)}
.rt{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.rt:last-child{border:0}
.rt .num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--onInk);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.rt b{display:block}.rt span{font-size:12.5px;color:var(--mut)}.rt .r{margin-left:auto}
/* dashboard */
.g-top{display:grid;grid-template-columns:1.05fr 1fr 1.2fr;gap:16px}
.g-bot{display:grid;grid-template-columns:1fr 2.15fr;gap:16px;margin-top:16px}
.col{display:flex;flex-direction:column;gap:16px}
.lbl{font-size:14px;color:var(--ink2);font-weight:500}
.big{font-size:36px;font-weight:700;letter-spacing:-1.2px;margin:6px 0 8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.inner{background:var(--soft);border-radius:16px;padding:14px}
.inner .ih{font-size:13px;font-weight:600;margin-bottom:10px}.inner .ih span{color:var(--mut);font-weight:500}
.lj{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lj>div{background:var(--card);border-radius:12px;padding:12px}
.lj .n{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.lj .n i{width:16px;height:16px;border-radius:5px;display:block}
.lj b{display:block;font-size:17px;margin:6px 0 2px;letter-spacing:-.4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;min-height:140px;border:1px solid var(--line)}
.tile .th{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--ink2);font-weight:500}
.tile .th i{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.tile .tv{font-size:26px;font-weight:700;letter-spacing:-.8px;margin-top:14px}
.tile .td{font-size:11.5px;color:var(--mut);margin-top:6px;display:flex;gap:6px;align-items:center}
.tile.acc{background:linear-gradient(150deg,var(--acc2),var(--acc));color:var(--accTx);border:0}
.tile.acc .th{color:var(--accTx)}.tile.acc .th i{background:rgba(255,255,255,.22)}.tile.acc .td{color:var(--accTx);opacity:.9}.tile.acc .chip{background:rgba(255,255,255,.22);color:var(--accTx)}
.chartw{background:var(--soft);border-radius:16px;padding:14px 14px 10px}
.chartw .ch{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:8px}
.leg{display:flex;gap:12px;font-size:11.5px;color:var(--ink2);font-weight:500}.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.chart{display:grid;grid-template-columns:34px 1fr;height:210px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--mut);padding-bottom:20px}
.plot{position:relative;display:flex;align-items:flex-end;gap:12px;padding-bottom:20px}
.plot .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;z-index:1}
.bar .stk{width:100%;max-width:34px;display:flex;flex-direction:column;gap:3px}
.bar .stk i{display:block;border-radius:7px}
.bar small{position:absolute;bottom:-19px;font-size:11px;color:var(--mut)}
.hatch{background:repeating-linear-gradient(135deg,var(--acc) 0 4px,var(--accL) 4px 7px)}
.solid{background:var(--ink)}
.meta{margin-bottom:16px}.meta:last-child{margin:0}
.meta .mh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.pb{height:14px;border-radius:99px;background:repeating-linear-gradient(135deg,var(--hat1) 0 3px,var(--hat2) 3px 6px);overflow:hidden}
.pb i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.pb.dk i{background:var(--ink)}
.mf{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:6px}.mf b{color:var(--ink)}
.dl{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dl:last-child{border:0}
.dl .ic{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.dl b{font-size:13.5px;display:block}.dl span{font-size:12px;color:var(--mut)}
.dl .r{margin-left:auto;text-align:right}
/* tabela */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse}
th{background:var(--soft);font-size:12px;font-weight:500;color:var(--ink2);text-align:left;padding:12px 14px;white-space:nowrap}
td{padding:13px 14px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:middle}
td.r,th.r{text-align:right;white-space:nowrap}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--soft)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 14px;min-width:220px}
.search input{background:transparent;border:0;padding:10px 0}
.search input:focus{background:transparent;border:0}
.x{all:unset;cursor:pointer;color:var(--mut);width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center}
.x:hover{background:var(--badS);color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:34px 10px}
/* PDV */
.pdv{display:grid;grid-template-columns:1fr 390px;gap:18px;align-items:start;margin-top:22px}
.pbar{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:99px;padding:6px 6px 6px 16px}
.pbar .search{border:0;flex:1;padding:0}
.cats{display:flex;gap:10px;overflow-x:auto;margin:14px 0 4px;padding-bottom:4px}
.cat{all:unset;cursor:pointer;background:var(--card);border-radius:16px;padding:12px 16px;min-width:118px;flex:none}
.cat span{display:block;font-size:12.5px;color:var(--mut)}
.cat b{display:block;font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.cat.on{background:var(--ink);color:var(--onInk)}.cat.on span{color:inherit;opacity:.65}
.sect{font-size:19px;font-weight:700;letter-spacing:-.4px;margin:18px 0 12px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.pc{all:unset;cursor:pointer;background:var(--card);border-radius:18px;padding:8px 8px 12px;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s;position:relative}
.pc:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.07)}
.pc .art{height:120px;border-radius:12px;display:grid;place-items:center}
.pc .art svg{width:70px;height:70px;stroke:#2A2B30;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pc .pn{font-size:13.5px;font-weight:600;margin:10px 4px 4px;line-height:1.3;min-height:35px}
.pc .pm{font-size:11px;color:var(--mut);margin:0 4px;line-height:1.5}
.pc .pf{display:flex;justify-content:space-between;align-items:center;margin:8px 4px 0}
.pc .pf b{font-size:15px}
.pc .add{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--onInk);display:grid;place-items:center}
.pc .add svg{width:15px;height:15px;stroke:var(--onInk)}
.pc .inc{position:absolute;top:14px;right:14px;background:var(--acc);color:var(--accTx);font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px}
.pc.out{opacity:.45}
html.dark .art:not(:has(img)),html.dark .th:not(:has(img)){filter:brightness(.8) saturate(.85)}
.art img,.th img{width:100%;height:100%;object-fit:cover;display:block}
.pc .art{overflow:hidden}.ci .th{overflow:hidden}
.th.sm{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none}.th.sm svg{width:24px;height:24px;stroke:#2A2B30;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ph{grid-column:1/-1;display:flex;gap:14px;align-items:center;cursor:pointer;border:1.5px dashed var(--line);border-radius:16px;padding:10px}
.ph .pv{width:96px;height:96px;border-radius:12px;overflow:hidden;display:grid;place-items:center;flex:none;background:var(--soft)}
.ph .pv img{width:100%;height:100%;object-fit:cover}
.ph b{display:block;font-size:13.5px;color:var(--ink)}.ph span{font-size:12px;color:var(--mut);font-weight:400}
.ro{background:var(--soft);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px}
.places{display:grid;gap:10px}
.place{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;transition:.15s}
.place:hover{border-color:var(--ink);background:var(--soft)}
.place i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.place b{display:block;font-size:15px}.place span{font-size:12px;color:var(--mut)}
.place .go{margin-left:auto;color:var(--mut)}
.back{all:unset;cursor:pointer;font-size:13px;color:var(--mut);display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
.where{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border-radius:99px;padding:6px 12px 6px 6px;font-size:13px;font-weight:600;margin-bottom:16px}
.where i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.logoimg{width:120px;height:120px;border-radius:18px;object-fit:cover;background:var(--soft)}
.low{color:var(--bad)!important;font-weight:600}
.cart{background:var(--card);border-radius:24px;padding:18px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.cart .chd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cart .chd b{font-size:16px}
.cart label{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin:10px 0 5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ci{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci .th{width:44px;height:44px;border-radius:10px;display:grid;place-items:center}
.ci .th svg{width:28px;height:28px;stroke:#2A2B30;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ci .nm{font-size:13px;font-weight:600;line-height:1.3}
.ci .sub{display:flex;align-items:center;gap:8px;margin-top:5px}
.qty{display:flex;align-items:center;background:var(--soft);border-radius:99px}
.qty button{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;font-weight:700}
.qty span{min-width:20px;text-align:center;font-size:12.5px;font-weight:600}
.ci .pr{width:92px;padding:5px 8px;font-size:12.5px;border-radius:8px}
.ci .tot{font-weight:700;font-size:13.5px;text-align:right}
.sumbox{background:var(--accS);border-radius:16px;padding:14px;margin:14px 0}
.sumbox p{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);padding:3px 0}
.sumbox p input{width:110px;padding:5px 8px;text-align:right;background:var(--card);border-radius:8px}
.sumbox .tt{border-top:1px solid rgba(0,0,0,.08);margin-top:6px;padding-top:9px;font-size:14px;color:var(--ink);font-weight:700}
.sumbox .tt b{font-size:20px;letter-spacing:-.5px}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay{all:unset;cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:12px;font-weight:600}
.pay.on{background:var(--ink);color:var(--onInk);border-color:var(--ink)}
.sw{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;font-weight:600;cursor:pointer}
.tog{width:40px;height:23px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.tog:after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--card);transition:.2s}
.tog.on{background:var(--acc)}.tog.on:after{left:20px}
.fin{margin-top:16px;padding:16px;font-size:15px}
.cartfab{display:none}.mobonly{display:none!important}
/* pedidos */
.ftabs{display:flex;gap:6px;flex-wrap:wrap}
.ftabs button{all:unset;cursor:pointer;background:var(--card);border-radius:99px;padding:9px 16px;font-size:13px;font-weight:500}
.ftabs button.on{background:var(--ink);color:var(--onInk)}
.ftabs button span{opacity:.6;margin-left:4px}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:16px}
.oc{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column}
.oh{display:flex;gap:12px;align-items:center}
.oav{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.oh b{font-size:15px;display:block}.oh small{font-size:11.5px;color:var(--mut);font-weight:500}
.oh .bx{margin-left:auto;text-align:right}
.oh .bx small{display:block;margin-top:5px;font-size:10.5px}
.od{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);padding:12px 0;border-bottom:1px solid var(--line);margin-top:12px}
.oit{width:100%;margin:10px 0 6px;flex:1}
.oit th{background:none;padding:4px 0;font-size:11.5px;color:var(--mut)}
.oit td{border:0;padding:4px 0;font-size:12.5px}
.omore{text-align:center;font-size:11.5px;color:var(--mut);padding:2px 0 4px}
.otot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:12px 0;font-weight:600}
.otot b{font-size:19px;letter-spacing:-.4px}
.ob{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cityrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* geral */
.k6{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mt{margin-top:16px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,20,24,.5);display:none;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(2px)}
.modal.on{display:grid}
.box{background:var(--card);border-radius:24px;padding:24px;width:min(600px,100%);max-height:92vh;overflow:auto}
.box.wide{width:min(780px,100%);background:var(--shell)}
.box h2{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:16px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut);font-weight:600}
.f .w{grid-column:1/-1}
.sec{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink2);font-weight:700;padding-top:12px;border-top:1px solid var(--line)}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chk label{flex-direction:row!important;align-items:center;gap:8px!important;background:var(--soft);border-radius:12px;padding:10px;color:var(--ink)!important;font-size:13px!important;cursor:pointer;font-weight:500!important}

/* login */

/* ===== LAYOUTS (muda a posição das coisas) ===== */
.ni{display:none}.gs{display:none;align-items:center;gap:8px;background:var(--card);border-radius:99px;padding:0 14px;height:42px;color:var(--mut);min-width:0}
.gs input{background:transparent;border:0;padding:0;height:100%}.gs input:focus{background:transparent;border:0}
.gs svg{flex:none}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:10px}.bars i{flex:1;background:var(--acc);border-radius:8px 8px 3px 3px;opacity:.9}.bars i:nth-child(odd){opacity:.45}
.lay-tag{position:fixed;right:12px;bottom:12px;background:#000c;color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;z-index:99}
/* --- MODERNO: 2 linhas, busca no topo, menu em pílulas abaixo --- */
html[data-lay=moderno] header{flex-wrap:wrap;row-gap:12px}
html[data-lay=moderno] .gs{display:flex;flex:1;max-width:420px;margin:0 auto}
html[data-lay=moderno] nav.top{order:5;flex:1 1 100%;justify-content:center;overflow:auto}

// ---------- PDV ----------
let cart=null;
function newCart(){const l=loja==='Todas'?lojasOk()[0]:loja;cart={items:[],cli:'',nc:{n:'',tel:''},loja:l,vend:defVend(l),desc:0,pag:'Pix',parc:1,pv:0,entr:0,entrPag:'Dinheiro',venc1:addM(hoje(),1),fromOrc:null,ent:false,cid:CIDADES[0],end:'',dEnt:iso(new Date(Date.now()+2*864e5)),obs:''}}
function defVend(l){const vs=S.vend.filter(v=>v.loja===l&&(!ownV()||v.id===CU.vend));return vs[0]?vs[0].id:''}
V.pdv=()=>{if(!cart)newCart();
 const cnt=c=>c==='Todos'?S.prod.length:S.prod.filter(p=>p.cat===c).length;
 return `<div class="pdv"><div>
  <div class="pbar"><div class="search">${ic('search')}<input id="pq" placeholder="Buscar produto pelo nome ou código" value="${H(pdvQ)}" oninput="pdvQ=this.value;drawProds()"></div>${can('del')?`<button class="btn light sm" onclick="fProd()">${ic('plus')}Produto</button>`:''}</div>
  <div class="cats">${['Todos',...CATS.filter(c=>cnt(c))].map(c=>`<button class="cat ${pdvCat===c?'on':''}" onclick="pdvCat='${c}';render()"><span>${c==='Todos'?'Todos':c}</span><b>${cnt(c)}</b></button>`).join('')}</div>
  <div class="sect">Escolha os produtos</div>
  <div class="prods" id="prods"></div></div>
  <div class="cart" id="cart"></div></div>
  <div class="cartfab" id="cfab" onclick="$('cart').classList.toggle('open')"></div>`;
};
function drawProds(){
 const q=pdvQ.toLowerCase();
 const ps=S.prod.filter(p=>(pdvCat==='Todos'||p.cat===pdvCat)&&(!q||p.n.toLowerCase().includes(q)||pcode(p.id).toLowerCase().includes(q)));
 $('prods').innerHTML=ps.map(p=>{const inC=cart.items.filter(i=>i.prod===p.id).reduce((a,i)=>a+i.q,0);return `<button class="pc ${p.q<=0?'out':''}" onclick="addItem('${p.id}')">${pArt(p)}${inC?`<span class="inc">${inC} no pedido</span>`:''}
  <div class="pn">${H(p.n)}</div><div class="pm">Código: ${pcode(p.id)}<br><span class="${p.q<=p.min?'low':''}">Disponível: ${p.q}</span></div>
  <div class="pf"><b>${R(p.p)}</b><span class="add">${ic('plus')}</span></div></button>`}).join('')||'<div class="empty" style="grid-column:1/-1">Nenhum produto encontrado</div>';
}
function addItem(id){const p=P(id);const it=cart.items.find(i=>i.prod===id);if(it)it.q++;else cart.items.push({prod:id,q:1,u:p.p});if(p.q<=cart.items.find(i=>i.prod===id).q-1)toast('Atenção: '+p.n+' está sem estoque suficiente');drawProds();drawCart()}
function cSub(){return cart.items.reduce((a,i)=>a+i.q*i.u,0)}
function drawCart(){
 const sub=cSub(),tot=Math.max(0,sub-(+cart.desc||0)),n=Math.max(0,...S.sales.map(s=>s.n))+1;
 const vs=S.vend.filter(v=>v.loja===cart.loja&&(!ownV()||v.id===CU.vend));
 $('cart').innerHTML=`<div class="chd"><b>Pedido Nº ${String(n).padStart(5,'0')}</b><div><button class="x" title="Limpar pedido" onclick="newCart();render()">${ic('trash','width:16px;height:16px')}</button><button class="x mobonly" onclick="$('cart').classList.remove('open')">${ic('x','width:16px;height:16px')}</button></div></div>
 <label>Cliente</label><select onchange="cart.cli=this.value;const c=S.cli.find(x=>x.id===this.value);if(c){cart.end=c.end||'';if(c.cid)cart.cid=c.cid}drawCart()"><option value="">Escolha o cliente…</option><option value="__new" ${cart.cli==='__new'?'selected':''}>+ Cliente novo</option>${S.cli.filter(cliOk).map(c=>`<option value="${c.id}" ${cart.cli===c.id?'selected':''}>${H(c.n)}</option>`).join('')}</select>
 ${cart.cli==='__new'?`<div class="two" style="margin-top:8px"><input placeholder="Nome" value="${H(cart.nc.n)}" onchange="cart.nc.n=this.value"><input placeholder="Telefone" value="${H(cart.nc.tel)}" onchange="cart.nc.tel=this.value"></div>`:''}
 <div class="two"><div><label>Loja</label>${lojasOk().length>1?`<select onchange="cart.loja=this.value;cart.vend=defVend(this.value);drawCart()">${lojasOk().map(l=>`<option ${cart.loja===l?'selected':''}>${l}</option>`).join('')}</select>`:`<div class="ro">${cart.loja}</div>`}</div>
 <div><label>Vendedor</label>${vs.length>1?`<select onchange="cart.vend=this.value">${vs.map(v=>`<option value="${v.id}" ${cart.vend===v.id?'selected':''}>${H(v.n)}</option>`).join('')}</select>`:`<div class="ro">${vs[0]?H(vs[0].n):'—'}</div>`}</div></div>
 <label style="margin-top:14px">Produtos</label>
 ${cart.items.map((i,k)=>{const p=P(i.prod);return `<div class="ci">${pArt(p,'th')}<div><div class="nm">${H(p.n)}</div><div class="sub"><div class="qty"><button onclick="cq(${k},-1)">−</button><span>${i.q}</span><button onclick="cq(${k},1)">+</button></div><input class="pr" type="number" value="${i.u}" onchange="cart.items[${k}].u=+this.value||0;drawCart()"></div></div><div><div class="tot">${R(i.q*i.u)}</div><button class="x" style="float:right" onclick="cart.items.splice(${k},1);drawProds();drawCart()">${ic('x','width:14px;height:14px')}</button></div></div>`}).join('')||'<div class="empty" style="padding:20px">Toque nos produtos pra adicionar<br><button class="btn acc sm mobonly" style="margin-top:12px" onclick="hideCart()">← Escolher os produtos</button></div>'}
 <div class="sumbox"><p><span>Subtotal</span><span>${R(sub)}</span></p><p><span>Desconto (R$)</span><input type="number" value="${cart.desc||''}" placeholder="0,00" oninput="cart.desc=+this.value||0;updTot()"></p><p class="tt"><span>Total</span><b id="ctot">${R(tot)}</b></p></div>
 <label>Pagamento</label><div class="pays">${PAG.map(p=>`<button class="pay ${cart.pag===p?'on':''}" onclick="cart.pag='${p}';drawCart()">${PAGS[p]}</button>`).join('')}</div>
 ${PARC.includes(cart.pag)&&cart.pag!=='Carnê'?`<label>Parcelas</label><select onchange="cart.parc=+this.value;cart.pv=0;drawCart()">${Array.from({length:cart.pag==='Carnê'?36:12},(_,i)=>`<option value="${i+1}" ${cart.parc===i+1?'selected':''}>${i+1}x</option>`).join('')}</select>`:''}
 ${cart.pag==='Carnê'?`<div class="two"><div><label>Entrada (R$)</label><input type="number" value="${cart.entr||''}" placeholder="0,00" onchange="cart.entr=+this.value||0;drawCart()"></div><div><label>Entrada paga em</label><select onchange="cart.entrPag=this.value">${['Dinheiro','Pix','Cartão de débito'].map(x=>`<option ${cart.entrPag===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <label>1º vencimento</label><input type="date" value="${cart.venc1}" onchange="cart.venc1=this.value;drawCart()">
 <label>Valor de cada parcela (R$) <span class="mut">· fica fixo, não muda sozinho</span></label><input type="number" step="0.01" value="${cart.pv||''}" placeholder="Ex.: 200" onchange="cart.pv=+this.value||0;drawCart()">
 <div class="mut" style="margin-top:6px">${(()=>{const rest=Math.max(0,tot-(cart.entr||0));if(cart.pv>0){const ps=genParcsV(rest,cart.pv,cart.venc1||hoje());const l=ps[ps.length-1],n=ps.length,f=n>1?(n-1)+(l.v/cart.pv):l.v/cart.pv;return 'Falta pagar <b style="color:var(--ink)">'+R(rest)+'</b>: '+(n>1?(n-1)+'x de <b style="color:var(--ink)">'+R(cart.pv)+'</b> + última de <b style="color:var(--ink)">'+R(l.v)+'</b>':'<b style="color:var(--ink)">'+R(l.v)+'</b> em 1 parcela')+' ('+(Math.round(f*10)/10).toString().replace('.',',')+' parcelas)'}return 'Digite o valor da parcela acima. Ou, se preferir dividir igual, escolha o número de parcelas abaixo.'})()} · todo dia ${+cart.venc1.slice(8)}</div>
 ${cart.pv>0?'':`<label>Ou dividir igualmente em</label><select onchange="cart.parc=+this.value;drawCart()">${Array.from({length:36},(_,i)=>`<option value="${i+1}" ${cart.parc===i+1?'selected':''}>${i+1}x de ${R(Math.max(0,tot-(cart.entr||0))/(i+1))}</option>`).join('')}</select>`}`:''}
 ${cart.pag!=='Carnê'&&fee({v:tot,pag:cart.pag,parc:cart.parc})>0?`<div class="mut" style="margin-top:6px">Taxa da maquininha: ${R(fee({v:tot,pag:cart.pag,parc:cart.parc}))}</div>`:''}
 <div class="sw" onclick="cart.ent=!cart.ent;drawCart()"><span>Entregar na casa do cliente</span><span class="tog ${cart.ent?'on':''}"></span></div>
 ${cart.ent?`<div class="two"><div><label>Cidade</label><select onchange="cart.cid=this.value">${CIDADES.map(c=>`<option ${cart.cid===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Data</label><input type="date" value="${cart.dEnt}" onchange="cart.dEnt=this.value"></div></div><label>Endereço</label><input placeholder="Rua, número, bairro" value="${H(cart.end)}" onchange="cart.end=this.value">`:''}
 <label>Observações (sai na via)</label><input placeholder="Ex.: cor branca, montagem inclusa" value="${H(cart.obs)}" onchange="cart.obs=this.value">
 <button class="btn acc block fin" onclick="finalizar()">Finalizar venda · <span id="ctot2">${R(tot)}</span></button>
 <button class="btn light block" style="margin-top:8px" onclick="salvarOrc()">${ic('pedidos','width:16px;height:16px')}Salvar como orçamento</button>
 ${cart.fromOrc?`<div class="mut" style="text-align:center;margin-top:8px">Carregado do orçamento nº ${String((S.orc.find(o=>o.id===cart.fromOrc)||{n:0}).n).padStart(5,'0')}</div>`:''}`;
 const q=cart.items.reduce((a,i)=>a+i.q,0);
 $('cfab').innerHTML=`<span>${q?q+' '+(q>1?'itens':'item')+' no pedido':'Pedido vazio'}</span><span>${R(tot)} →</span>`;
}
function updTot(){const t=R(Math.max(0,cSub()-(+cart.desc||0)));$('ctot').textContent=t;$('ctot2').textContent=t;const f=$('cfab');if(f)f.lastChild.textContent=t+' →'}
function cq(k,d){cart.items[k].q+=d;if(cart.items[k].q<1)cart.items.splice(k,1);drawProds();drawCart()}
function cliFromCart(){let cli=cart.cli;if(!cli){toast('Escolhe o cliente');return null}
 if(cli==='__new'){if(!cart.nc.n.trim()){toast('Coloca o nome do cliente novo');return null}cli=uid();S.cli.push({id:cli,loja:cart.loja,vend:cart.vend,n:cart.nc.n.trim(),tel:cart.nc.tel,cid:cart.ent?cart.cid:'',end:cart.ent?cart.end:''})}
 return cli}
function hideCart(){const c=$('cart');if(c)c.classList.remove('open')}
function finalizar(){
 if(!cart.items.length){const cc=$('cart');if(cc)cc.classList.remove('open');return toast('Falta escolher os produtos da venda. Toque nos produtos para adicionar.',5000)}
 const sub=cSub(),dc=+cart.desc||0,tot=sub-dc;
 if(cart.pag==='Carnê'&&(cart.entr||0)>=tot)return toast('A entrada não pode ser maior que o total');
 const cli=cliFromCart();if(!cli)return;
 const s={id:uid(),n:Math.max(0,...S.sales.map(s=>s.n))+1,d:hoje(),h:hhmm(),cli,vend:cart.vend,loja:cart.loja,items:cart.items.map(i=>({...i})),desc:dc,v:tot,pag:cart.pag,parc:PARC.includes(cart.pag)?cart.parc:1,obs:cart.obs,
  ent:cart.ent?{cid:cart.cid,end:cart.end,d:cart.dEnt||hoje(),st:'Agendada'}:null};
 if(s.pag==='Carnê'){s.entr=+cart.entr||0;s.entrPag=cart.entrPag;s.parcs=cart.pv>0?genParcsV(tot-s.entr,cart.pv,cart.venc1||addM(hoje(),1)):genParcs(tot-s.entr,s.parc,cart.venc1||addM(hoje(),1));s.parc=s.parcs.length;{const cc=S.cli.find(x=>x.id===cli);if(cc&&cart.pv>0)cc.pv=cart.pv}}
 s.fee=feeOf(s);logA(s,'Venda feita');
 S.sales.push(s);s.items.forEach(i=>{const p=S.prod.find(p=>p.id===i.prod);if(p)p.q=Math.max(0,p.q-i.q)});
 const c=S.cli.find(c=>c.id===cli);if(c&&cart.ent){c.cid=cart.cid;if(cart.end)c.end=cart.end}
 if(cart.fromOrc){const o=S.orc.find(x=>x.id===cart.fromOrc);if(o)o.conv=s.n}
 save().then(()=>{newCart();mes=hoje().slice(0,7);render();verVia(s.id,true)});
}
function salvarOrc(){
 if(!cart.items.length)return toast('Adiciona pelo menos um produto');
 const cli=cliFromCart();if(!cli)return;const sub=cSub(),dc=+cart.desc||0;
 const o={id:uid(),tipo:'orc',n:Math.max(0,...S.orc.map(o=>o.n))+1,d:hoje(),h:hhmm(),cli,vend:cart.vend,loja:cart.loja,items:cart.items.map(i=>({...i})),desc:dc,v:sub-dc,pag:cart.pag,parc:PARC.includes(cart.pag)?cart.parc:1,obs:cart.obs,val:iso(new Date(Date.now()+7*864e5)),
  ent:cart.ent?{cid:cart.cid,end:cart.end,d:cart.dEnt,st:'Agendada'}:null,entr:cart.pag==='Carnê'?+cart.entr||0:0};
 S.orc.push(o);save().then(()=>{newCart();render();verVia(o.id,'orc')});
}
function orcVenda(id){const o=S.orc.find(x=>x.id===id);newCart();Object.assign(cart,{items:o.items.map(i=>({...i,u:P(i.prod).p||i.u})),cli:o.cli,desc:o.desc,pag:o.pag,parc:o.parc,obs:o.obs,fromOrc:o.id,entr:o.entr||0});
 if(lojasOk().includes(o.loja)){cart.loja=o.loja;cart.vend=defVend(o.loja)}if(o.ent){cart.ent=true;cart.cid=o.ent.cid;cart.end=o.ent.end||''}close_();go('pdv');toast('Orçamento carregado. Confere e finaliza.')}

// ---------- pedidos ----------
V.pedidos=()=>{
 const all=S.sales.filter(s=>inM(s)&&inL(s)&&visS(s)).sort((a,b)=>b.d.localeCompare(a.d)||b.n-a.n);
 const ag=S.sales.filter(s=>s.ent&&s.ent.st==='Agendada'&&inL(s)&&visS(s)).sort((a,b)=>a.ent.d.localeCompare(b.ent.d));
 const cn=S.sales.filter(s=>s.canc&&inM(s)&&inL(s)&&visS0(s)).sort((a,b)=>b.d.localeCompare(a.d));
 const orcs=S.orc.filter(o=>!o.conv&&inL(o)&&visS0(o)).sort((a,b)=>b.n-a.n);
 const F={todos:['Todos',all],entregar:['A entregar',ag],entregues:['Entregues',all.filter(s=>s.ent&&s.ent.st==='Entregue')],retirados:['Retirados na loja',all.filter(s=>!s.ent)],orcamentos:['Orçamentos',orcs],cancelados:['Cancelados',cn]};
 const list=F[pedF][1];
 const porCid={};all.filter(s=>s.ent).forEach(s=>porCid[s.ent.cid]=(porCid[s.ent.cid]||0)+1);
 return head('Pedidos',pedF==='entregar'?'Todas as entregas que ainda faltam fazer':pedF==='orcamentos'?'Orçamentos em aberto':'Pedidos de '+mlabel(mes))+`
 <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div class="ftabs">${Object.entries(F).map(([k,[l,a]])=>`<button class="${pedF===k?'on':''}" onclick="pedF='${k}';render()">${l}<span>${a.length}</span></button>`).join('')}</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">${pedF==='entregar'?`<button class="btn dark sm" onclick="rota()">${ic('map','width:16px;height:16px')}Rota do dia</button>`:''}<div class="search" style="background:var(--card)">${ic('search')}<input placeholder="Buscar cliente, pedido ou produto" oninput="filtCards(this.value)"></div></div></div>
 ${['todos','entregar','entregues'].includes(pedF)?`<div class="cityrow">${CIDADES.map(c=>`<span class="chip" style="background:var(--card)">${ic('truck','width:13px;height:13px')} ${c} <b>${porCid[c]||0}</b></span>`).join('')}</div>`:''}
 <div class="orders" id="orders">${list.map(x=>x.tipo==='orc'?orcCard(x):card(x)).join('')||'<div class="card empty" style="grid-column:1/-1">Nenhum pedido aqui</div>'}</div>`;
};
const oav=(s,c)=>{const l2=s.loja==='Loja 2';return `<div class="oav" style="background:${l2?'var(--accS)':'var(--ink)'};color:${l2?'var(--acc)':'var(--onInk)'}">${ini(c.n)}</div>`};
const itTbl=s=>`<table class="oit"><tr><th>Itens</th><th class="r">Qtd</th><th class="r">Valor</th></tr>${s.items.slice(0,3).map(i=>`<tr><td>${H(P(i.prod).n)}</td><td class="r">${i.q}</td><td class="r">${R(i.q*i.u)}</td></tr>`).join('')}${s.desc?`<tr><td class="mut">Desconto</td><td></td><td class="r mut">- ${R(s.desc)}</td></tr>`:''}</table>${s.items.length>3?`<div class="omore">+${s.items.length-3} itens</div>`:''}`;
const dlong=d=>{const x=new Date(d+'T12:00');return ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][x.getDay()]+', '+br(d)};
function card(s){
 const c=C(s.cli),st=stOf(s),ico=st[1]==='ok'?'check':st[1]==='wa'?'clock':st[1]==='bad'?'ban':'store';
 const sl=s.canc?'Cancelado em '+brs(s.canc.d):s.ent?(s.ent.st==='Entregue'?'Entregue em '+brs(s.ent.d):'Previsão '+brs(s.ent.d)+' · '+s.ent.cid):'Cliente levou na hora';
 const ag=!s.canc&&s.ent&&s.ent.st==='Agendada';
 return `<div class="oc ${s.canc?'canc':''}" data-q="${H((c.n+' '+s.n+' '+dsc(s)).toLowerCase())}"><div class="oh">${oav(s,c)}<div><b>${H(c.n)}</b><small>Pedido #${String(s.n).padStart(5,'0')} / ${s.loja}</small></div>
  <div class="bx"><span class="badge ${st[1]}">${ic(ico)}${st[0]}</span><small class="st ${st[1]}">${sl}</small></div></div>
  <div class="od"><span>${dlong(s.d)}</span><span>${s.h||''}</span></div>
  ${itTbl(s)}
  ${s.canc?`<div class="mot"><b>Motivo:</b> ${H(s.canc.mot||'—')} · por ${H(s.canc.u)}</div>`:''}
  ${s.trocas&&s.trocas.length?`<div class="mut" style="margin:4px 0">${ic('swap','width:13px;height:13px;vertical-align:-2px')} ${s.trocas.length} troca${s.trocas.length>1?'s':''} feita${s.trocas.length>1?'s':''}</div>`:''}
  <div class="otot"><span>Total <span class="mut" style="font-weight:500">· ${PAGS[s.pag]}${s.parc>1?' '+s.parc+'x':''}</span></span><b style="${s.canc?'text-decoration:line-through':''}">${R(s.v)}</b></div>
  <div class="ob"><button class="btn light sm" onclick="verVia('${s.id}')">${ic('print','width:15px;height:15px')}Via do cliente</button>${ag?`<button class="btn acc sm" onclick="entregue('${s.id}')">${ic('check','width:15px;height:15px')}Marcar entregue</button>`:s.canc?`<button class="btn line sm" onclick="hist('${s.id}')">${ic('hist','width:15px;height:15px')}Histórico</button>`:`<button class="btn wa sm" onclick="zapPed('${s.id}')">${ic('wa')}WhatsApp + PDF</button>`}</div>
  ${s.canc?'':`<div class="ob2">${ag?waBtn(c.tel,msgEnt(s),'Avisar entrega'):''}${can('del')?`<button class="btn line" onclick="fTroca('${s.id}')">${ic('swap','width:14px;height:14px')}Troca</button><button class="btn line" onclick="fCanc('${s.id}')">${ic('ban','width:14px;height:14px')}Cancelar</button>`:''}<button class="btn line" onclick="fEnt('${s.id}')">${ic('pedidos','width:14px;height:14px')}Editar entrega</button><button class="btn line" onclick="hist('${s.id}')">${ic('hist','width:14px;height:14px')}Histórico</button></div>`}</div>`;
}
function orcCard(o){const c=C(o.cli),venc=o.val<hoje();
 return `<div class="oc" data-q="${H((c.n+' '+o.n+' '+dsc(o)).toLowerCase())}"><div class="oh">${oav(o,c)}<div><b>${H(c.n)}</b><small>Orçamento #${String(o.n).padStart(5,'0')} / ${o.loja}</small></div>
  <div class="bx"><span class="badge ${venc?'bad':'bl'}">${ic('pedidos')}${venc?'Vencido':'Orçamento'}</span><small class="st ${venc?'bad':'bl'}">Válido até ${brs(o.val)}</small></div></div>
  <div class="od"><span>${dlong(o.d)}</span><span>${H(VD(o.vend).n)}</span></div>${itTbl(o)}
  <div class="otot"><span>Total <span class="mut" style="font-weight:500">· ${PAGS[o.pag]}${o.parc>1?' '+o.parc+'x':''}</span></span><b>${R(o.v)}</b></div>
  <div class="ob"><button class="btn light sm" onclick="verVia('${o.id}')">${ic('print','width:15px;height:15px')}Ver / imprimir</button><button class="btn acc sm" onclick="orcVenda('${o.id}')">${ic('check','width:15px;height:15px')}Virar venda</button></div>
  <div class="ob2"><button class="btn wa sm" onclick="zapPed('${o.id}')">${ic('wa')}Mandar no WhatsApp + PDF</button><button class="btn line" onclick="S.orc=S.orc.filter(x=>x.id!=='${o.id}');save();render();toast('Orçamento apagado')">${ic('trash','width:14px;height:14px')}Apagar</button></div></div>`}
function filtCards(q){q=q.toLowerCase();document.querySelectorAll('#orders .oc').forEach(e=>e.style.display=e.dataset.q.includes(q)?'':'none')}
function fEnt(id){const s=S.sales.find(x=>x.id===id);if(!s)return;const e=s.ent||{cid:CIDADES[0],end:'',d:iso(new Date(Date.now()+2*864e5)),st:'Agendada'};
 modal(`<h2>Editar entrega · pedido #${String(s.n).padStart(5,'0')}</h2><div class="f">

let TR=null;

 <label>Quantidade devolvida<input id="trq" type="number" min="1" value="1" oninput="TR.rq=+this.value||1;drawTroca()"></label><div></div>
 <label class="w">Produto que ele vai levar no lugar<select onchange="TR.np=this.value;drawTroca()"><option value="">Nenhum, só devolução</option>${S.prod.map(p=>`<option value="${p.id}">${H(p.n)} · ${R(p.p)} (${p.q} em estoque)</option>`).join('')}</select></label>

 <label>Diferença paga/devolvida em<select onchange="TR.pag=this.value">${['Pix','Dinheiro','Cartão de débito','Cartão de crédito'].map(x=>`<option>${x}</option>`).join('')}</select></label>

 <div class="acts"><button class="btn light" onclick="close_()">Cancelar</button><button class="btn dark" onclick="doTroca()">Confirmar troca</button></div>`);drawTroca()}
function trDif(){const s=S.sales.find(x=>x.id===TR.id),it=s.items[TR.k];TR.rq=Math.min(TR.rq,it.q);const out=it.u*TR.rq,inn=TR.np?P(TR.np).p*TR.nq:0;return inn-out}
function drawTroca(){const d=trDif();$('trd').innerHTML=`<div class="diff ${d>=0?'ok':'bad'}"><span>${d>0?'Cliente paga a diferença':d<0?'Loja devolve pro cliente':'Troca sem diferença'}</span><span>${R(Math.abs(d))}</span></div>`}
function doTroca(){const s=S.sales.find(x=>x.id===TR.id),it=s.items[TR.k],d=trDif(),m=$('trm').value.trim();
 const op=S.prod.find(p=>p.id===it.prod);if(op)op.q+=TR.rq;
 const out={prod:it.prod,q:TR.rq,u:it.u};it.q-=TR.rq;if(it.q<=0)s.items.splice(TR.k,1);
 let inn=null;if(TR.np){const np=S.prod.find(p=>p.id===TR.np);np.q=Math.max(0,np.q-TR.nq);inn={prod:TR.np,q:TR.nq,u:np.p};s.items.push({...inn})}
 s.v=Math.round((s.v+d)*100)/100;(s.trocas=s.trocas||[]).push({d:hoje(),dif:d,pag:TR.pag,u:CU.n,out,inn,mot:m});
 logA(s,`Troca: devolveu ${out.q}x ${P(out.prod).n}${inn?`, levou ${inn.q}x ${P(inn.prod).n}`:''}${d?` (${d>0?'pagou':'recebeu'} ${R(Math.abs(d))} em ${TR.pag})`:''}${m?' · '+m:''}`);
 save();close_();render();toast('Troca registrada')}

const r2=x=>Math.round((+x||0)*100)/100;
const paidOf=p=>p.pago&&!p.vp?p.v:(p.vp||0);
const prem=p=>p.pago&&!p.vp?0:r2(p.v-(p.vp||0));
const pstat=(p,hj)=>prem(p)<=0?'paga':(p.adi&&p.adi>=hj)?'adiada':p.venc<hj?'atrasada':'aberta';
const openPs=s=>(s.parcs||[]).filter(p=>!p.canc&&prem(p)>0).sort((a,b)=>a.k-b.k);
function doReceber(id){
 const s=S.sales.find(x=>x.id===id),v=r2(+$('rcv').value),d=$('rcd').value||hoje(),fp=$('rcf').value,ps=openPs(s),falta=r2(ps.reduce((a,p)=>a+prem(p),0));
 if(!(v>0))return toast('Coloca o valor recebido');
 if(v>falta+0.004)return toast('O valor passa do que falta no carnê ('+R(falta)+')',3500);
 const L=lojasOk().length===1?lojasOk()[0]:s.loja;let rest=v;
 for(const p of ps){if(rest<=0.004)break;const x=Math.min(rest,prem(p));p.vp=r2((p.vp||0)+x);rest=r2(rest-x);p.fp=fp;p.u=CU.n;p.loja=L;p.adi=null;if(prem(p)<=0)p.pago=d}
 S.cpag.push({id:uid(),vid:s.id,d,v,fp,loja:L,u:CU.n});
 const cl=S.cli.find(x=>x.id===s.cli),pv=+$('rcpv').value;if(cl&&pv>0)cl.pv=pv;
 logA(s,`Recebido ${R(v)} do carnê em ${fp}`);save();close_();render();toast('Recebimento registrado')}
//#CARNE-END
const atrasoTxt=old=>{const d=Math.floor((new Date(hoje())-new Date(old))/864e5),m=Math.floor(d/30);return m>=1?`${m} ${m>1?'meses':'mês'} (${d} dias)`:`${d} dia${d>1?'s':''}`};
V.carne=()=>{
 const hj=hoje(),rows=[],sales=S.sales.filter(s=>s.parcs&&s.parcs.length&&inL(s)&&visS(s));
 sales.forEach(s=>s.parcs.forEach(p=>{if(!p.canc)rows.push({s,p,st:pstat(p,hj)})}));
 const rem=a=>a.reduce((x,r)=>x+prem(r.p),0);
 const at=rows.filter(r=>r.st==='atrasada'),ab=rows.filter(r=>r.st!=='paga'),ad=rows.filter(r=>r.st==='adiada'),
  pg=S.cpag.filter(x=>x.d.slice(0,7)===mes&&sales.some(s=>s.id===x.vid)),
  sem=rows.filter(r=>r.st==='aberta'&&r.p.venc<=iso(new Date(Date.now()+7*864e5)));
 const dev=sales.map(s=>{const ps=s.parcs.filter(p=>!p.canc),falta=r2(ps.reduce((a,p)=>a+prem(p),0));if(falta<=0.004)return null;
  const atr=ps.filter(p=>pstat(p,hj)==='atrasada'),atv=r2(atr.reduce((a,p)=>a+prem(p),0)),old=atr.reduce((m,p)=>!m||p.venc<m?p.venc:m,''),
  adi=ps.filter(p=>pstat(p,hj)==='adiada'),
  ult=[...S.cpag.filter(x=>x.vid===s.id).map(x=>x.d),...ps.filter(p=>p.pago&&!p.vp).map(p=>p.pago)].sort().pop()||'';
  return{s,falta,atv,old,adi,ult,prox:openPs(s)[0],pagoT:ps.reduce((a,p)=>a+paidOf(p),0),tot:ps.reduce((a,p)=>a+p.v,0)}}).filter(Boolean).sort((a,b)=>b.atv-a.atv||a.old.localeCompare(b.old));
 const F={devedores:['Por cliente',dev],atrasadas:['Atrasadas',at],aberto:['Em aberto',rows.filter(r=>r.st==='aberta')],adiadas:['Adiadas',ad],pagas:['Pagas no mês',rows.filter(r=>r.st==='paga'&&r.p.pago&&r.p.pago.slice(0,7)===mes)],todas:['Todas',rows]};
 const tile=(l,v,d,k,acc)=>`<div class="tile ${acc?'acc':''}"><div class="th"><span>${l}</span><i>${ic(k,'width:16px;height:16px')}</i></div><div><div class="tv">${v}</div><div class="td">${d}</div></div></div>`;
 const stTxt=(p,st)=>{const extra=p.vp>0&&prem(p)>0?` · pagou ${R(p.vp)}`:'';
  if(st==='paga')return `<span class="st ok">Paga em ${brs(p.pago)} · ${PAGS[p.fp]||p.fp||''}</span>`;
  if(st==='adiada')return `<span class="st wa">Adiada até ${br(p.adi)}${extra}</span>`;
  if(st==='atrasada'){const dl=Math.round((new Date(hj)-new Date(p.venc))/864e5);return `<span class="st bad">${dl} dia${dl>1?'s':''} de atraso${extra}</span>`}
  return `<span class="st wa">Em aberto${extra}</span>`};
 const cur=carF in F?carF:'devedores';
 let tbl;
 if(cur==='devedores'){
  tbl=`<tr><th>Cliente</th><th>Pedido</th><th class="r">Parcela</th><th class="r">Já pagou</th><th class="r">Falta</th><th>Situação</th><th>Último pagamento</th><th class="r"></th></tr>`+
  (dev.map(({s,falta,atv,old,adi,ult,prox,pagoT,tot})=>{const c=C(s.cli),pr={...prox,v:prem(prox)};
   const sit=atv>0?`<span class="st bad">${R(atv)} em atraso</span><div class="mut">há ${atrasoTxt(old)}</div>`:adi.length?`<span class="st wa">Adiado</span>`:`<span class="st ok">Em dia</span>`;
   return `<tr><td><b>${H(c.n)}</b><div class="mut">${H(c.tel)}</div></td><td class="mut">#${String(s.n).padStart(5,'0')} · ${s.loja}</td><td class="r">${R(c.pv>0?c.pv:prox.v)}<div class="mut">${c.pv>0?'combinada':'por mês'}</div></td><td class="r">${R(pagoT)}<div class="mut">de ${R(tot)}</div></td><td class="r"><b>${R(falta)}</b></td><td>${sit}</td><td>${ult?br(ult):'—'}</td>
   <td class="r" style="white-space:nowrap">${waBtn(c.tel,msgParc(s,pr),'Cobrar')} <button class="btn dark sm" onclick="fReceber('${s.id}')">Receber</button> <button class="btn light sm" onclick="fReparc('${s.id}')">Parcela</button> ${atv>0?`<button class="btn light sm" onclick="fAdiar('${s.id}')">Adiar</button>`:adi.length?`<button class="btn light sm" onclick="tirarAdi('${s.id}')">Tirar adiamento</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Nenhum carnê com valor em aberto</td></tr>');
 }else{
  const list=[...F[cur][1]].sort((a,b)=>cur==='pagas'?b.p.pago.localeCompare(a.p.pago):a.p.venc.localeCompare(b.p.venc));
  tbl=`<tr><th>Cliente</th><th>Pedido</th><th>Parcela</th><th>Vencimento</th><th class="r">Valor</th><th>Status</th><th class="r"></th></tr>`+
  (list.map(({s,p,st})=>{const c=C(s.cli);return `<tr><td><b>${H(c.n)}</b><div class="mut">${H(c.tel)}</div></td><td class="mut">#${String(s.n).padStart(5,'0')} · ${s.loja}</td><td>${p.k}/${s.parcs.length}</td><td>${br(p.venc)}</td><td class="r"><b>${R(p.v)}</b>${p.vp>0&&prem(p)>0?`<div class="mut">falta ${R(prem(p))}</div>`:''}</td><td>${stTxt(p,st)}</td>
   <td class="r" style="white-space:nowrap">${st==='paga'?'':`${waBtn(c.tel,msgParc(s,{...p,v:prem(p)}),'Cobrar')} <button class="btn dark sm" onclick="fReceber('${s.id}')">Receber</button>`}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Nada por aqui</td></tr>');
 }
 return head('Carnê','Pagamento livre: o cliente paga o que puder e o sistema abate das parcelas mais antigas')+`
 <div class="k6">${tile('Atrasado',R(rem(at)),`${new Set(at.map(r=>r.s.cli)).size} clientes · ${at.length} parcelas`,'clock',true)}${tile('A receber',R(rem(ab)),ab.length+' parcelas em aberto','carne')}${tile('Recebido em '+MES[+mes.slice(5)-1],R(pg.reduce((a,x)=>a+x.v,0)),pg.length+' pagamentos','check')}${tile('Vence nos próximos dias',R(rem(sem)),sem.length+' parcelas','pedidos')}</div>
 <div class="card mt"><div class="ct"><div class="ftabs">${Object.entries(F).map(([k,[l,a]])=>`<button class="${cur===k?'on':''}" style="${cur===k?'':'background:var(--soft)'}" onclick="carF='${k}';render()">${l}<span>${a.length}</span></button>`).join('')}</div><div class="search">${ic('search')}<input placeholder="Buscar cliente" oninput="filtRows(this.value,'cart_')"></div></div>
 <div class="tw"><table id="cart_">${tbl}</table></div></div>`;
};
function prevRec(id){const s=S.sales.find(x=>x.id===id),v=r2(+$('rcv').value);let rest=v;const out=[];
 for(const p of openPs(s)){if(rest<=0.004)break;const x=Math.min(rest,prem(p));rest=r2(rest-x);out.push(`${p.k}ª parcela: ${R(x)} ${x>=prem(p)-0.004?'(quita)':`(ainda faltam ${R(prem(p)-x)})`}`)}
 $('rcp').innerHTML=v>0?out.join('<br>')+(rest>0.004?`<br><b style="color:var(--bad)">Passa ${R(rest)} do que falta no carnê</b>`:''):''}
function fReceber(id){const s=S.sales.find(x=>x.id===id),c=C(s.cli),ps=openPs(s);
 if(!ps.length)return toast('Esse carnê já está todo pago');
 const falta=r2(ps.reduce((a,p)=>a+prem(p),0)),sug=Math.min(falta,c.pv>0?c.pv:prem(ps[0])),hist=S.cpag.filter(x=>x.vid===id).sort((a,b)=>b.d.localeCompare(a.d));
 modal(`<h2>Receber do carnê</h2><p class="mut" style="margin-bottom:14px">${H(c.n)} · pedido #${String(s.n).padStart(5,'0')} · falta ${R(falta)} em ${ps.length} parcela${ps.length>1?'s':''}</p>
 <div class="f"><label>Valor recebido (R$)<input id="rcv" type="number" step="0.01" value="${sug}" oninput="prevRec('${id}')"></label><label>Data do pagamento<input id="rcd" type="date" value="${hoje()}"></label>

 <div class="acts"><button class="btn light" onclick="close_()">Cancelar</button><button class="btn dark" onclick="doReceber('${id}')">Confirmar recebimento</button></div>`);prevRec(id)}
function fReparc(id){const s=S.sales.find(x=>x.id===id),c=C(s.cli),ps=openPs(s);if(!ps.length)return toast('Esse carnê já está todo pago');
 const falta=r2(ps.reduce((a,p)=>a+prem(p),0));
 modal(`<h2>Valor da parcela</h2><p class="mut" style="margin-bottom:14px">${H(c.n)} · pedido #${String(s.n).padStart(5,'0')} · falta ${R(falta)}. As parcelas em aberto são refeitas com o valor que você combinar. O que já foi pago não muda.</p>

 <div class="acts"><button class="btn light" onclick="close_()">Cancelar</button><button class="btn dark" onclick="sReparc('${id}')">Salvar</button></div>`);prevReparc(id)}
function reparcPs(s,pv){const open=openPs(s),keep=open.filter(p=>(p.vp||0)>0),free=open.filter(p=>!(p.vp>0)),rest=r2(free.reduce((a,p)=>a+p.v,0));return{open,keep,free,rest,novas:free.length&&pv>0?genParcsV(rest,pv,free[0].venc):[]}}
function prevReparc(id){const s=S.sales.find(x=>x.id===id),pv=+$('rpv').value,r=reparcPs(s,pv);const l=r.novas[r.novas.length-1];$('rpp').innerHTML=pv>0&&l?(r.novas.length>1?(r.novas.length-1)+'x de <b>'+R(pv)+'</b> + última de <b>'+R(l.v)+'</b>':'1 parcela de <b>'+R(l.v)+'</b>')+' (total '+R(r.rest)+')':''}
function sReparc(id){const s=S.sales.find(x=>x.id===id),pv=+$('rpv').value;if(!(pv>0))return toast('Coloca o valor da parcela');const r=reparcPs(s,pv);
 const ks=r.free.map(p=>p.k).sort((a,b)=>a-b);let mx=Math.max(0,...s.parcs.map(p=>p.k));
 const novas=r.novas.map((p,i)=>({...p,k:i<ks.length?ks[i]:++mx}));
 const sobra=r.free.filter(p=>!ks.slice(0,novas.length).includes(p.k)).map(p=>({...p,v:0,pago:null,vp:0,canc:true}));
 s.parcs=[...s.parcs.filter(p=>!r.free.includes(p)),...novas,...sobra].sort((a,b)=>a.k-b.k);s.parc=s.parcs.filter(p=>!p.canc).length;

async function admFn(body){
 await SYNC();const{data,error}=await SB.functions.invoke('admin-usuarios',{body});
 if(error){let m=error.message;try{m=(await error.context.json()).erro||m}catch(e){}throw new Error(m)}
 if(data&&data.erro)throw new Error(data.erro);return data}
async function sUser(id){
 const n=$('un').value.trim(),us=$('uu').value.trim().toLowerCase(),pw=$('up').value;
 if(!n||!us)return toast('Preenche nome e login');
 if(!id&&pw.length<6)return toast('A senha precisa de pelo menos 6 caracteres');
 if(id&&pw&&pw.length<6)return toast('A senha precisa de pelo menos 6 caracteres');
 const o={nome:n,perfil:$('ur').value,vendedor_id:$('uv').value||null,telas:[...document.querySelectorAll('.utab:checked')].map(x=>x.value),lojas:[...document.querySelectorAll('.uloj:checked')].map(x=>x.value),so_proprias:$('u_own').checked,ve_lucro:$('u_lucro').checked,pode_gerir:$('u_del').checked};
 if(o.perfil==='admin')o.lojas=LOJAS.slice();else if(!o.lojas.length)return toast('Marca pelo menos uma loja');
 const u=S.users.find(x=>x.id===id);
 if(u&&u.role==='admin'&&o.perfil!=='admin'&&S.users.filter(x=>x.role==='admin').length===1)return toast('Precisa ficar pelo menos um administrador');
 try{const rs=await admFn(id?{acao:'atualizar',id,...o,...(pw?{senha:pw}:{})}:{acao:'criar',usuario:us,senha:pw,...o});
  const tid=id||(rs&&rs.id),at=o.perfil!=='admin'&&$('u_atac').checked&&o.lojas.includes('Loja 1');
  if(tid){const e=await SB.from('profiles').update({atacado:at}).eq('id',tid);if(e.error)throw e.error}
  await loadAll();close_();render();toast('Usuário salvo')}catch(e){toast(e.message||'Não deu pra salvar',4500)}
}
async function delUser(id){
 if(!confirm('Remover esse usuário? Ele perde o acesso na hora.'))return;
 try{await admFn({acao:'excluir',id});await loadAll();close_();render();toast('Usuário removido')}catch(e){toast(e.message||'Não deu pra remover',4500)}
}

function home(){const t=tabsOk();go(t[0]?t[0][0]:'geral')}
function gBusca(q){const b=$('gres');if(!b)return;q=(q||'').trim().toLowerCase();if(q.length<2||!CU){b.style.display='none';return}
 const out=[];const add=(t,a)=>{if(a.length)out.push(`<div class="gt">${t}</div>`+a.join(''))};
 add('Clientes',S.cli.filter(c=>(c.n||'').toLowerCase().includes(q)||(c.tel||'').includes(q)).slice(0,5).map(c=>`<button onclick="gIr('cli','${c.id}')"><span>${H(c.n)}</span><small>${H(c.tel||'')}</small></button>`));
 add('Pedidos',S.sales.filter(s=>visS(s)&&(String(s.n).padStart(5,'0').includes(q)||(C(s.cli).n||'').toLowerCase().includes(q))).sort((a,b)=>b.n-a.n).slice(0,5).map(s=>`<button onclick="gIr('ped','${s.id}')"><span>#${String(s.n).padStart(5,'0')} · ${H(C(s.cli).n)}</span><small>${R(s.v)}</small></button>`));
 add('Produtos',S.prod.filter(p=>(p.n||'').toLowerCase().includes(q)).slice(0,5).map(p=>`<button onclick="gIr('prod','${p.id}')"><span>${H(p.n)}</span><small>${p.q} un.</small></button>`));
 if(tabsOk().some(t=>t[0]==='fornecedores'))add('Fornecedores',S.forn.filter(f=>(f.n||'').toLowerCase().includes(q)).slice(0,4).map(f=>`<button onclick="gIr('forn','${f.id}')"><span>${H(f.n)}</span><small>${H(f.tel||'')}</small></button>`));
 b.innerHTML=out.join('')||'<div class="gt">Nada encontrado</div>';b.style.display='block'}

const PLACES=[['Loja 1','Loja 1','Entrar pra vender e ver os pedidos da Loja 1','store','var(--ink)','var(--onInk)'],['Loja 2','Loja 2','Entrar pra vender e ver os pedidos da Loja 2','store','var(--acc)','var(--accTx)'],['adm','Administração','Ver as duas lojas, o financeiro e os acessos','admin','var(--soft)','var(--ink)']];

 if(!LSEL){$('lf').innerHTML=`<h3>Onde você vai entrar?</h3><p>Escolha a sua loja. Quem é da gerência entra pela Administração.</p><div class="places">${PLACES.map(p=>`<button class="place" onclick="LSEL='${p[0]}';drawLogin()"><i style="background:${p[4]};color:${p[5]}">${ic(p[3])}</i><div><b>${p[1]}</b><span>${p[2]}</span></div><span class="go">›</span></button>`).join('')}</div>`;return}

 $('lf').innerHTML=`<button class="back" onclick="LSEL=null;drawLogin()">‹ Trocar</button><div><span class="where"><i style="background:${p[4]};color:${p[5]}">${ic(p[3],'width:14px;height:14px')}</i>${p[1]}</span></div>

async function login(){const u=$('lu').value.trim().toLowerCase(),p=$('lp').value;if(!u||!p)return toast('Preenche usuário e senha');
 const{error}=await SB.auth.signInWithPassword({email:u+DOM,password:p});if(error)return toast('Usuário ou senha errados');
 if(!await loadAll())return;const x=CU,no=async m=>{await SB.auth.signOut();S=skel();CU=null;toast(m)};
 if(LSEL==='adm'&&x.role!=='admin')return no('Esse usuário não tem acesso à Administração');

 SL=LSEL==='adm'?null:LSEL;try{localStorage.setItem('cn-gestao-sess2',JSON.stringify({l:SL}))}catch(e){}
 LSEL=null;tab=SL&&!isAdm()?'pdv':'geral';loja=SL||'Todas';cart=null;render()}

function resizeImg(file,max,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);cb(c.toDataURL('image/jpeg',.82),w,h)};im.onerror=()=>toast('Não consegui abrir essa imagem');im.src=fr.result};fr.readAsDataURL(file)}
let TMPIMG=null;
function pickImg(inp){const f=inp.files[0];if(!f)return;resizeImg(f,520,d=>{TMPIMG=d;$('phv').innerHTML=`<img src="${d}">`;$('pht').textContent='Foto escolhida ✓'})}
function pickLogo(inp){const f=inp.files[0];if(!f)return;resizeImg(f,400,(d,w,h)=>{S.store.logo=d;S.store.lw=w;S.store.lh=h;save();render();toast('Logo atualizada')})}

 const f=new File([blob],nome,{type:'application/pdf'});
 const semTel=!String(c.tel||'').replace(/[^0-9]/g,'');
 if(semTel){try{if(navigator.canShare&&navigator.canShare({files:[f]})){toast('Cliente sem telefone cadastrado. Escolha o contato na lista',5000);await navigator.share({files:[f],text:txt,title:nome});return}}catch(e){if(e&&e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),20000);
